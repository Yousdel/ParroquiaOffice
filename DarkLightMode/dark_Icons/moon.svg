<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!--
    Grupo para aplicar la rotación.
    rotate(-25 50 50) significa:
      - Rotar -25 grados (en sentido antihorario).
      - El centro de rotación es (50, 50), el centro del viewBox.
  -->
  <g transform="rotate(-25 50 50)">
    <!--
      La forma de la luna se define con un path.
      - d: Define la forma del trazado.
      - fill: Color de relleno (blanco).
      - stroke: Color del borde (negro).
      - stroke-width: Grosor del borde.
      - stroke-linejoin: Hace que las esquinas del borde sean redondeadas.
    -->
    <path
      d="M 30 25
         A 30 30 0 1 1 30 75
         A 22 22 0 1 0 30 25
         Z"
      fill="white"
      stroke="black"
      stroke-width="3"
      stroke-linejoin="round" />
  </g>
</svg>
