<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="128" viewBox="0 0 128 128" version="1.1">
  <!-- Sol: centro amarillo y 8 rayos -->
  <g fill="#FFD54F" stroke="none" transform="translate(64,64)">
    <!-- Rayos: rectángulos rotados -->
    <g>
      <rect x="-3" y="-46" width="6" height="20" rx="2" ry="2"/>
      <rect x="-3" y="-46" width="6" height="20" rx="2" ry="2" transform="rotate(45)"/>
      <rect x="-3" y="-46" width="6" height="20" rx="2" ry="2" transform="rotate(90)"/>
      <rect x="-3" y="-46" width="6" height="20" rx="2" ry="2" transform="rotate(135)"/>
      <rect x="-3" y="-46" width="6" height="20" rx="2" ry="2" transform="rotate(180)"/>
      <rect x="-3" y="-46" width="6" height="20" rx="2" ry="2" transform="rotate(225)"/>
      <rect x="-3" y="-46" width="6" height="20" rx="2" ry="2" transform="rotate(270)"/>
      <rect x="-3" y="-46" width="6" height="20" rx="2" ry="2" transform="rotate(315)"/>
    </g>
    <!-- Centro -->
    <circle cx="0" cy="0" r="28" />
  </g>
</svg>
