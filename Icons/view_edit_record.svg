<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24" viewBox="0 0 24 24" version="1.1">
  <!-- Card / ficha -->
  <rect x="1.5" y="3" width="21" height="18" rx="2" ry="2"
        fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eye (ver) -->
  <path d="M4.5 11.0C6.2 7.8 10.0 7.8 11.7 11.0C10.0 14.2 6.2 14.2 4.5 11.0Z"
        fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="9.0" cy="11.0" r="1.1" fill="#000000"/>
  <!-- Pencil (editar) - cuerpo -->
  <path d="M13.8 7.2 L18.6 11.9 L14.4 16.1 L10.9 17.4 L12.2 13.9 Z"
        fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
