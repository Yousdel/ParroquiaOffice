  <path d="M18.6 11.9 L19.6 12.9 L18.0 14.5 L17.0 13.5 Z"
        fill="#000000" stroke="#000000" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small detail on pencil body -->
  <line x1="12.6" y1="14.0" x2="15.2" y2="11.4"
        stroke="#000000" stroke-width="0.9" stroke-linecap="round"/>
</svg>
