<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="128"
     viewBox="0 0 128 128"
     version="1.1">
  <title>Parroquia Office Icon</title>
  <desc>Icono representando una iglesia con elementos de oficina</desc>
  <g>
    <!-- Fondo circular -->
    <circle cx="64" cy="64" r="60" fill="#f5f5f5" stroke="#555" stroke-width="4"/>

    <!-- Iglesia estilizada -->
    <path d="M64 28 L48 48 L48 80 L80 80 L80 48 Z" fill="#8b5e3c" stroke="#333" stroke-width="2"/>
    <rect x="58" y="60" width="12" height="20" fill="#ffffff" stroke="#333" stroke-width="1"/>
    <line x1="64" y1="28" x2="64" y2="18" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="22" x2="68" y2="22" stroke="#333" stroke-width="2"/>

    <!-- Cruz -->
    <line x1="64" y1="18" x2="64" y2="12" stroke="#333" stroke-width="2"/>
    <line x1="62" y1="14" x2="66" y2="14" stroke="#333" stroke-width="2"/>

    <!-- Elemento de oficina: carpeta -->
    <rect x="30" y="85" width="68" height="30" rx="4" ry="4" fill="#4a90e2" stroke="#333" stroke-width="2"/>
    <rect x="34" y="89" width="60" height="22" fill="#ffffff" stroke="#333" stroke-width="1"/>
    <text x="64" y="104" font-size="10" font-family="Arial" fill="#333" text-anchor="middle">Datos</text>
  </g>
</svg>